<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Password Generator </title>
    <link rel="stylesheet" href="main.css">
    <link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@100..900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <h1> PASSWORD GENERATOR </h1>

        <!---input field with button-->
        <div class="dispalay-container">
            <input type="text" readonly placeholder="Password" class="dispalay" data-passwordDisplay>

             <button  id="copyBtn" data-copy>
            <span  data-copyMsg id="tooltip"></span>
            <img src="./images/copy.svg" alt="" width="23" height="23">
        </button>
        </div>

        <!--Creating slider and check boxes-->

        <div class="input-container">
            <div class="length-container" >
                <p>Password Length</p>
                <p data-lengthData>0</p>
            </div>
            <!--creating slider-->
            <input type="range" min="1" max="20" class="slider" step="1" data-lengthSlider>

            <!--Creating Checkboxes-->
            <div class="check">
                <input type="checkbox" id="uppercase">
                <label for="uppercase">Includes Uppercase Letters</label>
            </div>

             <div class="check">
                <input type="checkbox" id="lowercase">
                <label for="uppercase">Includes Lowercase Letters</label>
            </div>

             <div class="check">
                <input type="checkbox" id="numbers">
                <label for="uppercase">Include Numbers</label>
            </div>

             <div class="check">
                <input type="checkbox" id="symbols">
                <label for="uppercase">Include Symbols</label>
            </div>

            <!--Strength-->  
            <div class="strength-container">
                <p>Strength</p>
                 <div data-indicator class="indicator"></div>
            </div>

            <!--Generate Password  button-->
            <button class="generateButton">GENERATE PASSWORD</button>

              
               


        </div>
         
       
    </div>



    <script src="main.js"></script>
    
</body>
</html>
